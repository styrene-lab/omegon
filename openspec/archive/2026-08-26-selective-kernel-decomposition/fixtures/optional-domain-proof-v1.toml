schema_version = 1
test_command_prefix = ["cargo", "test", "-p", "omegon", "--locked"]

kernel_sources = [
  "core/crates/omegon/src/capability_admission.rs",
  "core/crates/omegon/src/contribution_graph.rs",
  "core/crates/omegon/src/invocation_service.rs",
  "core/crates/omegon/src/service_generation.rs",
  "core/crates/omegon/src/session_authority.rs",
]

[[domains]]
id = "plans-work"
composition = "no-resource in-process service"
maintenance_packages = ["styrene-work-model", "styrene-work-runtime"]
kernel_tokens = ["work_aggregation", "styrene_work_model", "styrene_work_runtime"]
architecture = { path = "docs/selective-kernel-decomposition.md", marker = "service:work-snapshot" }
absence = { path = "core/crates/omegon/src/plan.rs", test = "absent_work_service_keeps_session_plan_without_scanning_repository" }
degradation = { path = "core/crates/omegon/src/features/work_aggregation.rs", test = "absent_repository_sources_publish_an_empty_degraded_snapshot" }
public = { status = "not-applicable", reason = "Repository-work aggregation preserves existing plan commands and wire shapes; absence changes no public syntax or durable contract." }

[[domains]]
id = "behavior-policy"
composition = "no-resource in-process service"
maintenance_packages = []
kernel_tokens = ["behavior_policy", "BehaviorPolicyBinding", "DefaultBehaviorPolicy"]
architecture = { path = "docs/selective-kernel-decomposition.md", marker = "stateless behavior-policy service" }
absence = { path = "core/crates/omegon/src/features/behavior_policy.rs", test = "behavior_policy_absence_is_none_without_fabricated_identity" }
degradation = { path = "core/crates/omegon/src/contribution_graph.rs", test = "optional_dependency_warning_preserves_graph_and_errors_still_reject" }
public = { status = "not-applicable", reason = "Behavior policy is advisory internal loop policy; the lane preserves commands, configuration, schemas, and frontend wire shapes." }

[[domains]]
id = "codescan"
composition = "release-coupled native extension"
