architecture = { path = "docs/codebase-search.md", marker = "codescan extension is absent or cannot start" }
absence = { path = "core/crates/omegon/src/codescan_service.rs", test = "absent_extension_is_typed_unavailable" }
degradation = { path = "core/crates/omegon/src/tools/codebase_search.rs", test = "unavailable_service_keeps_tools_declared_and_returns_typed_evidence" }
public = { status = "documented", path = "site/src/pages/docs/commands.astro", marker = "typed unavailability if the codescan extension is absent or cannot start" }

