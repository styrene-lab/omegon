id: headroom-read-large-markdown
kind: evaluation
repo: .
base_ref: HEAD
model: anthropic:claude-sonnet-4-6
slim: false
prompt: |
  Evaluate native headroom on long markdown/design surfaces. Read docs/headroom-native-compression.md and docs/design/native-headroom-compression-plan.md, then summarize the current default-on readiness gates, remaining provider work, and benchmark evidence requirements. Retrieve originals if compressed handles are emitted.
harnesses:
  - omegon
acceptance:
  required:
    - 'grep -q "Native Headroom-Compatible Compression" docs/headroom-native-compression.md'
    - 'grep -q "default-on" docs/design/native-headroom-compression-plan.md'
success_files:
  - docs/headroom-native-compression.md
  - docs/design/native-headroom-compression-plan.md
budget:
  soft:
    max_turns: 12
    max_total_tokens: 700000
    max_wall_clock_sec: 900
  hard:
    max_turns: 24
    max_total_tokens: 1400000
    max_wall_clock_sec: 1800
headroom:
  run_eval: true
  eval_fixtures: .tmp/headroom/fixtures
  corpus_manifest: docs/evals/headroom-corpus-large.example.json
  refresh_fixtures: auto
  max_restored_facts: 0
  token_counter: bytes_div_4
  expect_eval_status: pass
  expect_restored_facts_max: 0
  expect_min_savings_percent: 80
notes: |
  Evidence-gathering benchmark for markdown compression and decision retention.
