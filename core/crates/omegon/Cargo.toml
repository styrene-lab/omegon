[package]
name = "omegon"
description = "Rust-native agent loop and lifecycle engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "omegon"
path = "src/main.rs"
required-features = ["product"]

[[bin]]
name = "omegon-kernel-host"
path = "src/kernel_host.rs"
required-features = ["kernel-host"]

[[test]]
name = "kernel_host_provider_blackbox"
path = "tests/kernel_host_provider_blackbox.rs"
required-features = ["kernel-host"]

[[test]]
name = "task_capsule_tool_budget_blackbox"
path = "tests/task_capsule_tool_budget_blackbox.rs"
required-features = ["task-capsule"]

[[example]]
name = "fractal_demo"
required-features = ["tui"]

[[example]]
name = "instrument_lab"
required-features = ["tui"]

[dependencies]
omegon-extension = { version = "0.25", optional = true }
omegon-native-extension-host = { path = "../omegon-native-extension-host" }
omegon-kernel-runtime = { path = "../omegon-kernel-runtime" }
omegon-maintenance-contracts = { path = "../omegon-maintenance-contracts", optional = true }
omegon-traits = { path = "../omegon-traits", optional = true }
omegon-git = { path = "../omegon-git", optional = true }
git2 = { version = "0.20", features = ["vendored-libgit2", "vendored-openssl"], optional = true }
shlex = { version = "1.3", optional = true }
agent-client-protocol = { version = "0.12", features = ["unstable"], optional = true }
ignore = { version = "0.4", optional = true }
grep-regex = { version = "0.1", optional = true }
grep-matcher = { version = "0.1", optional = true }
omegon-memory = { path = "../omegon-memory", features = ["agent"], optional = true }
omegon-codescan-contracts = { path = "../omegon-codescan-contracts" }
omegon-secrets = { path = "../omegon-secrets", features = ["agent"], optional = true }
omegon-opsx = { path = "../omegon-opsx", optional = true }
omegon-skills = { path = "../omegon-skills", optional = true }
omegon-web = { path = "../omegon-web", optional = true }
styrene-work-model = { path = "../styrene-work-model", optional = true }
styrene-work-runtime = { path = "../styrene-work-runtime", optional = true }
tokio = { workspace = true }
serde = { workspace = true }
toml = { workspace = true, optional = true }
serde_json = { workspace = true }
jsonc-parser = { workspace = true, optional = true }
serde_yaml = { workspace = true, optional = true }
anyhow = { workspace = true }
thiserror = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
clap = { workspace = true }
rusqlite = { workspace = true, optional = true }
tokio-util = { workspace = true }
indexmap = { workspace = true, optional = true }
flynt-models = { workspace = true, optional = true }
uuid = { version = "1", features = ["v4", "v5", "serde"], optional = true }
dirs = { version = "6.0.0", optional = true }
socket2 = { version = "0.5", features = ["all"], optional = true }
unicode-truncate = { version = "2.0", optional = true }
chrono = { version = "0.4", optional = true }
libc = { version = "0.2", optional = true }
regex-lite = { version = "0.1", optional = true }
url = { version = "2", optional = true }
ratatui = { version = "0.30.0", optional = true }
unicode-segmentation = { version = "1.13.2", optional = true }
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "regex-onig"] , optional = true }
tui-syntax-highlight = { version = "0.2", optional = true }
tachyonfx = { version = "0.25.0", features = ["sendable"] , optional = true }
crossterm = { version = "0.29.0", optional = true }
reqwest = { version = "0.13.2", features = ["json", "stream", "blocking"], optional = true }
tokio-stream = { version = "0.1.18", optional = true }
sha2 = { version = "0.10.9", optional = true }
fs2 = { version = "0.4", optional = true }
tempfile = { version = "3.27.0", optional = true }
secrecy = { version = "0.10", optional = true }
sysinfo = { version = "0.33", optional = true }
getrandom = { version = "0.4.2", optional = true }
open = { version = "5.3.3", optional = true }
tracing-appender = { version = "0.2.4", optional = true }
unicode-width = { version = "0.2.2", optional = true }
ratatui-image = { version = "11.0.2", default-features = false, features = ["crossterm", "image-defaults"] , optional = true }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] , optional = true }
axum = { version = "0.8.8", features = ["ws", "macros"], optional = true }
tower-http = { version = "0.6.8", features = ["cors"], optional = true }
rustls = { version = "0.23", optional = true }
rustls-pemfile = { version = "2", optional = true }
tokio-rustls = { version = "0.26", optional = true }
futures = { version = "0.3", optional = true }
futures-util = { version = "0.3.32", optional = true }
base64 = { version = "0.22", optional = true }
hmac = { version = "0.12", optional = true }
ansi-to-tui = { version = "8.0", optional = true }
tui-tree-widget = { version = "0.24", optional = true }
ratatui-toaster = { version = "0.1", optional = true }
ratatui-textarea = { version = "0.9.1", features = ["crossterm"] , optional = true }
tui-popup = { version = "0.7", optional = true }
hyperrat = { version = "0.1", optional = true }
rmcp = { version = "1.2", features = ["transport-child-process", "client", "transport-streamable-http-client-reqwest", "auth"], default-features = false, optional = true }
tar = { version = "0.4", optional = true }
flate2 = { version = "1.0", optional = true }
sigstore = { version = "0.13.0", default-features = false, features = ["cosign", "rustls-tls"], optional = true }
x509-parser = { version = "0.17", optional = true }
rpassword = { version = "7", optional = true }
rpkl = { version = "0.8", optional = true }
percent-encoding = { version = "2", optional = true }
styrene-mqtt = { version = "0.1.0", optional = true }
styrene-rbac = { version = "0.1.0", optional = true }
omegon-rbac = { path = "../omegon-rbac", optional = true }
cron = { version = "0.16", optional = true }
notify = { version = "8.0", optional = true }
content_inspector = { version = "0.2", optional = true }
mime_guess = { version = "2", optional = true }
portable-pty = { version = "0.9.0", optional = true }

# Local embedding (optional — adds ~15MB ONNX Runtime to binary)
ort = { version = "2.0.0-rc.12", optional = true, features = ["ndarray"] }
tokenizers = { version = "0.23", optional = true, default-features = false, features = ["onig"] }
ndarray = { version = "0.17", optional = true }

[features]
default = ["product", "tui", "self-update"]
product = [
    "product-domains",
    "dep:agent-client-protocol",
    "dep:async-trait",
    "dep:axum",
    "dep:base64",
    "dep:chrono",
    "dep:content_inspector",
    "dep:cron",
    "dep:dirs",
    "dep:flate2",
    "dep:fs2",
    "dep:futures",
    "dep:futures-util",
    "dep:getrandom",
    "dep:grep-matcher",
    "dep:grep-regex",
    "dep:hmac",
    "dep:ignore",
    "dep:indexmap",
    "dep:jsonc-parser",
    "dep:libc",
    "dep:mime_guess",
    "dep:notify",
    "dep:omegon-extension",
    "dep:omegon-maintenance-contracts",
    "dep:omegon-rbac",
    "dep:omegon-traits",
    "dep:open",
    "dep:percent-encoding",
    "dep:portable-pty",
    "dep:regex-lite",
    "dep:reqwest",
    "dep:rmcp",
    "dep:rpassword",
    "dep:rpkl",
    "dep:rustls",
    "dep:rustls-pemfile",
    "dep:secrecy",
    "dep:serde_yaml",
    "dep:sha2",
    "dep:shlex",
    "dep:socket2",
    "dep:styrene-mqtt",
    "dep:styrene-rbac",
    "dep:sysinfo",
    "dep:tar",
    "dep:tempfile",
    "dep:thiserror",
    "dep:tokio-rustls",
    "dep:tokio-stream",
    "dep:toml",
    "dep:tower-http",
    "dep:tracing",
    "dep:tracing-appender",
    "dep:tracing-subscriber",
    "dep:unicode-truncate",
    "dep:url",
    "dep:uuid",
]
product-domains = [
    "dep:flynt-models",
    "dep:git2",
    "dep:omegon-git",
    "dep:omegon-memory",
    "dep:omegon-opsx",
    "dep:omegon-secrets",
    "dep:omegon-skills",
    "dep:omegon-web",
    "dep:rusqlite",
    "dep:styrene-work-model",
    "dep:styrene-work-runtime",
]
kernel-host = []
task-capsule = ["product"]
self-update = ["dep:sigstore", "dep:x509-parser"]
tui = ["dep:unicode-segmentation", "dep:ratatui", "dep:syntect", "dep:tui-syntax-highlight", "dep:tachyonfx", "dep:crossterm", "dep:unicode-width", "dep:ratatui-image", "dep:image", "dep:ansi-to-tui", "dep:tui-tree-widget", "dep:ratatui-toaster", "dep:ratatui-textarea", "dep:tui-popup", "dep:hyperrat"]
local-embeddings = ["dep:ort", "dep:tokenizers", "dep:ndarray"]

[dev-dependencies]
insta = "1.46"
tempfile = "3.27.0"
