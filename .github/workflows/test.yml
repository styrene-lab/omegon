name: Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    branches: [main]

jobs:
  python-release-policy:
    name: Python release policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Test composition and release policy
        run: python3 scripts/test_release_policy.py
      - name: Check distribution smoke entry point
        run: python3 scripts/smoke_distribution_runtime.py --help

  nix-host-distribution-smoke:
    name: Nix host-only distribution smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v17
      - name: Build and exercise the packaged Nix host
        run: |
          nix build .#omegon --accept-flake-config
          python3 scripts/smoke_distribution_runtime.py nix-host \
            --binary "$(readlink -f result/bin/omegon)" \
            --metadata result/share/omegon/distribution-profile.json

  rust-build:
    name: Rust build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Build omegon binary
        run: cargo build -p omegon
      - name: Check shrinking Omegon composition
        run: |
          cargo check -p omegon --bin omegon --locked --no-default-features --features product
          python3 scripts/check_headless_dependency_boundary.py
      - name: Check kernel host dependency boundary
        run: |
          cargo check -p omegon --bin omegon-kernel-host --locked --no-default-features --features kernel-host
          python3 scripts/check_kernel_dependency_boundary.py
      - name: Check task capsule feature boundary
        run: |
          cargo check -p omegon --locked --no-default-features --features task-capsule
          cargo clippy -p omegon --bin omegon --locked --no-default-features --features task-capsule -- -D warnings
          python3 scripts/check_task_capsule_dependency_boundary.py
          python3 -m unittest tests/test_task_capsule_dependency_boundary.py
      - name: Reject unsupported task capsule feature combinations
        run: |
          set +e
          output=$(cargo check -p omegon --locked --no-default-features \
            --features task-capsule,tui,self-update,local-embeddings 2>&1)
          status=$?
          set -e
          test "$status" -ne 0
          for message in \
            "without the tui feature" \
            "without the self-update feature" \
            "without the local-embeddings feature"; do
            case "$output" in
              *"$message"*) ;;
              *) printf '%s\n' "$output"; exit 1 ;;
            esac
          done
      - name: Test task capsule contracts
        run: |
          for filter in \
            tests::task_capsule_composition_profile_is_accepted_by_the_cli \
            runtime_composition::tests::task_capsule_identity_is_compile_derived_and_bounded \
            update::tests::disabled_self_update_fails_before_processing_release_metadata; do
            cargo test -p omegon --bin omegon --locked --no-default-features \
              --features task-capsule "$filter" -- --exact
          done
      - name: Build and exercise task capsule release binary
        run: |
          CARGO_TARGET_DIR=target/task-capsule cargo build -p omegon --release --locked \
            --no-default-features --features task-capsule
          python3 scripts/check_task_capsule_runtime.py target/task-capsule/release/omegon

  rust-unit:
    name: Rust unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run omegon tests
        env:
          OMEGON_NERD_FONT: "1"
        # Match just test-rust: these tests exercise process-global cwd/env/profile state.
        run: cargo test -p omegon --bin omegon -- --nocapture --test-threads=1

  rust-integration:
    name: Rust integration tests
    runs-on: ubuntu-latest
    # Cargo's feature-aware --tests selection includes the serialized binary suite.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run omegon integration tests
        env:
          OMEGON_NERD_FONT: "1"
        # Keep feature-gated targets excluded by Cargo's default feature selection.
        run: cargo test -p omegon --tests -- --nocapture --test-threads=1

  unix-terminal-detachment:
    name: Unix terminal detachment acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run real PTY terminal-loss acceptance
        env:
          OMEGON_NERD_FONT: "1"
        run: cargo test -p omegon --test terminal_detachment_pty --locked real_terminal_detachment_terminalizes_idle_and_active_sessions -- --ignored --exact --test-threads=1 --nocapture

  session-recovery-campaign:
    name: Session recovery campaign (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run frozen recovery campaign serially
        env:
          OMEGON_NERD_FONT: "1"
        run: "cargo test -p omegon --bin omegon session_recovery_campaign:: -- --test-threads=1 --nocapture"

  lifecycle-campaign:
    name: Lifecycle campaign (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Enforce managed lifecycle ownership
        run: python3 scripts/check_lifecycle_source_guard.py
      - name: Run managed lifecycle campaign serially
        env:
          OMEGON_NERD_FONT: "1"
        run: "cargo test -p omegon --bin omegon lifecycle_campaign:: --locked -- --test-threads=1 --nocapture"
      - name: Run lifecycle transaction recovery serially
        env:
          OMEGON_NERD_FONT: "1"
        run: "cargo test -p omegon --bin omegon lifecycle_transaction::tests:: --locked -- --test-threads=1 --nocapture"
      - name: Run OpenSpec transaction recovery serially
        env:
          OMEGON_NERD_FONT: "1"
        run: "cargo test -p omegon --bin omegon lifecycle_openspec_transaction::tests:: --locked -- --test-threads=1 --nocapture"
      - name: Run lifecycle service compatibility serially
        env:
          OMEGON_NERD_FONT: "1"
        run: "cargo test -p omegon --bin omegon lifecycle_service::tests:: --locked -- --test-threads=1 --nocapture"

  memory-managed-campaign:
    name: Memory managed-service campaign (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Test memory source guard
        run: python3 scripts/test_check_memory_source_guard.py
      - name: Enforce managed memory ownership
        run: python3 scripts/check_memory_source_guard.py
      - name: Run memory domain tests
        run: cargo test -p omegon-memory --locked
      - name: Run managed memory service tests serially
        env:
          OMEGON_NERD_FONT: "1"
        run: "cargo test -p omegon --bin omegon memory_service::tests:: --locked -- --test-threads=1 --nocapture"
      - name: Run managed memory campaign serially
        env:
          OMEGON_NERD_FONT: "1"
        run: "cargo test -p omegon --bin omegon memory_campaign:: --locked -- --ignored --test-threads=1 --nocapture"

  git-managed-campaign:
    name: Git managed-service campaign (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run Git domain and process-tree tests
        run: cargo test -p omegon-git --locked
      - name: Run managed Git service campaign serially
        env:
          OMEGON_NERD_FONT: "1"
        run: "cargo test -p omegon --bin omegon git_service::tests:: --locked -- --test-threads=1 --nocapture"

  codescan-managed-campaign:
    name: Codescan managed-service campaign (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run codescan domain tests
        run: |
          cargo test -p omegon-codescan-contracts --locked
          cargo test -p omegon-codescan --locked
      - name: Run native codescan extension tests
        run: cargo test --manifest-path extensions/omegon-codescan/Cargo.toml --locked
      - name: Run host codescan adapter tests
        env:
          OMEGON_NERD_FONT: "1"
        run: |
          cargo test -p omegon --bin omegon codescan_service::tests:: --locked --no-default-features --features product -- --test-threads=1 --nocapture
          cargo test -p omegon --bin omegon tools::codebase_search::tests:: --locked --no-default-features --features product -- --test-threads=1 --nocapture

  native-extension-conformance:
    name: Native extension conformance campaign
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Build first-party native extensions
        run: |
          cargo build --release --manifest-path extensions/omegon-browser/Cargo.toml --locked
          cargo build --release --manifest-path extensions/omegon-codescan/Cargo.toml --features conformance-hooks --locked
          cargo build --release --manifest-path extensions/omegon-tdd-savepoint/Cargo.toml --locked
      - name: Run deterministic host conformance fixtures
        env:
          OMEGON_NERD_FONT: "1"
        run: cargo test -p omegon extensions::conformance_tests --locked -- --test-threads=1 --nocapture
      - name: Run first-party handshake campaign
        env:
          OMEGON_NERD_FONT: "1"
        run: cargo test -p omegon extensions::conformance_tests::every_first_party_native_extension_passes_the_host_handshake --locked -- --ignored --exact --test-threads=1 --nocapture
      - name: Run release-coupled codescan acceptance
        env:
          OMEGON_NERD_FONT: "1"
        run: |
          cargo test -p omegon setup::tests::release_coupled_codescan_traverses_discovery_and_host_binding --locked -- --ignored --exact --test-threads=1 --nocapture
          cargo test -p omegon setup::tests::release_codescan_can_be_enabled_on_restart_without_reinstall --locked -- --ignored --exact --test-threads=1 --nocapture

  additive-composition-ladder:
    name: Additive composition ladder
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run artifact compositions and enforce aggregate budgets
        env:
          OMEGON_NERD_FONT: "1"
        run: python3 scripts/check_composition_matrix.py --artifact-ladder --cargo-profile release

  operational-kernel-promotion-profiles:
    name: Operational kernel promotion profiles
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install just
        uses: extractions/setup-just@v3
      - name: Build task capsule runtime prerequisite
        run: |
          CARGO_TARGET_DIR=target/task-capsule cargo build -p omegon --release --locked \
            --no-default-features --features task-capsule
      - name: Execute provider, signed-core, and SDK-addon evidence
        env:
          OMEGON_NERD_FONT: "1"
        run: |
          python3 scripts/check_operational_kernel_core_corpus.py \
            --execute-profile provider-backed-kernel \
            --execute-profile signed-core-component \
            --execute-profile sdk-addon
          python3 scripts/check_operational_kernel_core_corpus.py \
            --profile milestone-pr-readiness

  rust-standalone-crates:
    name: Standalone crate tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Standalone crate compilation (no workspace deps)
        run: |
          cargo build -p omegon-memory --no-default-features
          cargo build -p omegon-secrets --no-default-features
          cargo test -p omegon-memory --no-default-features
          cargo test -p omegon-secrets --no-default-features

  maintenance-boundary:
    name: Maintenance composition boundary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Validate maintenance dependency boundary
        run: python3 scripts/check_maintenance_dependency_boundary.py
      - name: Test maintenance contracts and companion
        run: |
          cargo test -p omegon-maintenance-contracts --locked
          cargo test -p omegon-maintain --locked

  extension-install-integration:
    name: Extension install integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Extension install integration tests
        run: cargo test -p omegon --test extension_install_blackbox -- --test-threads=1 --nocapture

  daemon-smoke:
    name: Smoke reference daemon launcher
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Build omegon binary
        run: cargo build -p omegon
      - name: Smoke reference daemon launcher
        run: |
          python3 scripts/launch_omegon_daemon.py \
            --binary target/debug/omegon \
            --cwd "$PWD" \
            --model anthropic:claude-sonnet-4-6 \
            --control-port 7856 \
            --strict-port

  benchmark-validation:
    name: Benchmark validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Validate benchmark task definitions
        run: python3 scripts/validate_benchmarks.py
      - name: Validate benchmark harness loads
        run: |
          python3 -c "
          import importlib.util, sys
          spec = importlib.util.spec_from_file_location('h', 'scripts/benchmark_harness.py')
          m = importlib.util.module_from_spec(spec)
          sys.modules['h'] = m
          spec.loader.exec_module(m)
          print('benchmark_harness.py: ok')
          "

  site-docs:
    name: Site docs tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install site dependencies
        working-directory: site
        run: npm ci
      - name: Run site docs tests
        run: node --test site/tests/docs-content.test.mjs

  lipstyk:
    name: lipstyk
    uses: styrene-lab/lipstyk/.github/workflows/lipstyk.yml@main
    with:
      paths: "core/crates/"
      # The reusable workflow runs the full scan threshold before the PR diff
      # gate. Keep the full scan report/SARIF useful without blocking every PR
      # on existing repository-wide baseline debt; the diff threshold remains
      # the merge gate for newly introduced findings.
      threshold: 999999
      diff-threshold: 15
